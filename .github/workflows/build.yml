name: Build & Release ShiftFlow

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6 qdarkstyle openpyxl python-docx python-dotenv google-genai

      - name: Build EXE
        run: |
          pyinstaller ShiftFlow.spec

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShiftFlow.exe
          generate_release_notes: true
